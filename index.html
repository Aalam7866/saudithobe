<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saudi Thobe</title>
<meta name="theme-color" content="#16213a">
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: fixed ink sidebar woven with a Sadu band on the right (RTL), bright workspace on the left; phone = top bar + bottom tab rail */
:root{
  --ink:#16213a;        /* sidebar / headings */
  --ink-2:#22304f;
  --brass:#b5862c;      /* single accent */
  --brass-soft:#f3e8cf;
  --ground:#f4f5f2;     /* page */
  --surface:#ffffff;
  --line:#e2e4dd;
  --text:#1c2333;
  --muted:#6a7180;
  --ok:#2f7d55; --ok-bg:#e3f1e9;
  --warn:#a8640f; --warn-bg:#fbeedb;
  --bad:#b23b3b; --bad-bg:#f8e3e3;
  --info:#2f5f9e; --info-bg:#e3ecf7;
  --side-fg:#e9e3d3;
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#0d1424;--ink-2:#1a2440;--brass:#d6a64b;--brass-soft:#3a2f18;
  --ground:#11151d;--surface:#181e29;--line:#283041;--text:#e8e9ec;--muted:#9aa1ae;
  --ok:#6cc596;--ok-bg:#163326;--warn:#e3a55a;--warn-bg:#3a2a14;--bad:#ef8a8a;--bad-bg:#3d1c1c;--info:#8db5ec;--info-bg:#1a2b45;--side-fg:#e9e3d3;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#0d1424;--ink-2:#1a2440;--brass:#d6a64b;--brass-soft:#3a2f18;
  --ground:#11151d;--surface:#181e29;--line:#283041;--text:#e8e9ec;--muted:#9aa1ae;
  --ok:#6cc596;--ok-bg:#163326;--warn:#e3a55a;--warn-bg:#3a2a14;--bad:#ef8a8a;--bad-bg:#3d1c1c;--info:#8db5ec;--info-bg:#1a2b45;--side-fg:#e9e3d3;color-scheme:dark}

html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;direction:ltr}

/* ---------- Sidebar ---------- */
.side{background:var(--ink);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.sadu{height:14px;flex:none;background:
  linear-gradient(45deg,transparent 33%,var(--brass) 33% 41%,transparent 41% 59%,var(--brass) 59% 67%,transparent 67%) 0 0/14px 14px,
  linear-gradient(-45deg,transparent 33%,#7d2b2b 33% 41%,transparent 41% 59%,#7d2b2b 59% 67%,transparent 67%) 0 0/14px 14px,
  #0a0f1c}
.brand{padding:22px 20px 18px;display:flex;gap:12px;align-items:center}
.mark{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;letter-spacing:.04em;color:var(--brass);flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.2}
.brand small{color:#a9a392;font-size:12px;font-family:var(--f-num);direction:ltr;display:block;text-align:left}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8576;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;opacity:.75}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav a.on svg{opacity:1;color:var(--brass)}
.nav a .cnt{margin-inline-start:auto;font-family:var(--f-num);font-size:11.5px;background:rgba(181,134,44,.22);color:#f0d9a6;padding:1px 8px;border-radius:20px}
.side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brass);color:#16213a;display:grid;place-items:center;font-weight:700}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding-block:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:0;width:240px}
.search input{border:0;outline:0;background:transparent;width:100%}
.search svg{width:16px;color:var(--muted);flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .btn.pri{background:var(--brass);color:#16213a;border-color:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--brass);color:#16213a;border-color:var(--brass)}}
.btn.pri:hover{filter:brightness(1.15)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px}
.view{padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15.5px;margin:0;font-weight:700}
.panel-h .sp{flex:1}
.panel-b{padding:16px 18px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}

/* KPIs: one strip, not a wall of cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:18px 20px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.kpi:first-child{border-inline-start:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.15}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-inline-start:4px}
.kpi .d{font-size:12px}
.up{color:var(--ok)} .dn{color:var(--bad)}

/* Production pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.stage{padding:14px 12px;text-align:center;position:relative;cursor:pointer;border-inline-start:1px dashed var(--line)}
.stage:first-child{border-inline-start:0}
.stage:hover{background:var(--ground)}
.stage .n{font-family:var(--f-num);font-size:26px;font-weight:600}
.stage .t{font-size:12.5px;color:var(--muted)}
.stage .bar{height:4px;border-radius:4px;margin-top:10px;background:var(--line);overflow:hidden}
.stage .bar i{display:block;height:100%;background:var(--brass)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--info-bg);color:var(--info)}
.s-cut,.s-sew,.s-iron{background:var(--warn-bg);color:var(--warn)}
.s-ready{background:var(--ok-bg);color:var(--ok)}
.s-done{background:var(--line);color:var(--muted)}
.s-late{background:var(--bad-bg);color:var(--bad)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--ground)}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--ground)}
tbody tr:last-child td{border-bottom:0}
.who b{display:block;font-weight:600}
.who span{font-size:12px;color:var(--muted);font-family:var(--f-num);direction:ltr;display:inline-block}
.rid{font-family:var(--f-num);color:var(--brass);font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .chip.on{background:var(--brass);color:#16213a;border-color:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--brass);color:#16213a;border-color:var(--brass)}}
.chip .num{opacity:.7;margin-inline-start:4px;font-size:11.5px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow span{font-size:12.5px;color:var(--muted)}
.days{font-family:var(--f-num);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--ground)}
.days.late{background:var(--bad-bg);color:var(--bad)}
.days.today{background:var(--warn-bg);color:var(--warn)}

/* tailors */
.load{height:8px;border-radius:6px;background:var(--line);overflow:hidden;width:120px}
.load i{display:block;height:100%;background:var(--ink-2)}
:root[data-theme="dark"] .load i{background:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .load i{background:var(--brass)}}

/* chart */
svg.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
svg.chart .gl{stroke:var(--line)}
svg.chart .ln{stroke:var(--brass);fill:none;stroke-width:2.2}
svg.chart .ar{fill:var(--brass);opacity:.12}
svg.chart .bar{fill:var(--ink-2)}
:root[data-theme="dark"] svg.chart .bar{fill:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) svg.chart .bar{fill:var(--brass)}}
svg.chart .dot{fill:var(--surface);stroke:var(--brass);stroke-width:2}

/* ---------- Form ---------- */
.form{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.sec{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brass);background:var(--surface)}
.meas input{font-family:var(--f-num);text-align:center;font-size:16px;font-weight:600}
.meas .field label{text-align:center}
.unit{font-size:11px;color:var(--muted);text-align:center}

/* design picker */
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding-inline:18px}
.dtab{border:0;background:transparent;padding:11px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.dtab.on{color:var(--text);border-color:var(--brass)}
.dtab small{display:block;font-weight:500;font-size:11px;font-family:var(--f-num);direction:ltr}
.dopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:16px 18px}
.dopt{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dopt svg{width:64px;height:54px;color:var(--text)}
.dopt span{font-size:12.5px;font-weight:600}
.dopt em{font-style:normal;font-size:10.5px;color:var(--muted);direction:ltr}
.dopt.on{border-color:var(--brass);background:var(--brass-soft)}
.dopt:hover{border-color:var(--brass)}

/* order slip (summary) */
.slip{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip .head{background:var(--ink);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.slip .head b{font-family:var(--f-display);font-size:18px;font-weight:600}
.slip .head .num{color:var(--brass)}
.slip dl{margin:0;padding:6px 18px}
.slip dl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.slip dt{color:var(--muted)}
.slip dd{margin:0;font-weight:600;text-align:right}
.slip .tot{padding:14px 18px;background:var(--ground);display:flex;flex-direction:column;gap:6px}
.slip .tot div{display:flex;justify-content:space-between}
.slip .tot .big{font-size:19px;font-weight:700}
.slip .act{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.slip .act .btn{justify-content:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:30}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(520px,100%);background:var(--surface);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);direction:ltr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dh h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.drawer .db{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.steps{display:flex;gap:0}
.step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:22px}
.step::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.step::after{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--line)}
.step:last-child::after{display:none}
.step.done{color:var(--text)}
.step.done::before,.step.done::after{background:var(--brass)}
.step.cur{color:var(--text);font-weight:700}
.step.cur::before{background:var(--surface);border:3px solid var(--brass);width:14px;height:14px;top:5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--ground);border-radius:8px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--f-num);font-size:15px}
.msg{background:var(--ground);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;border-inline-start:3px solid var(--ok)}
.h4{font-weight:700;font-size:13.5px;margin:0 0 8px}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;z-index:50;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}

.empty{padding:40px;text-align:center;color:var(--muted)}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--brass-soft);color:var(--brass);font-weight:700}
.demo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}


/* branch switcher */
.bsel{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding-inline:10px;min-width:0}
.bsel svg{width:16px;color:var(--brass);flex:none}
.bsel select{border:0;background:transparent;padding:8px 2px;font-weight:600;outline:0;min-width:0;max-width:200px}
.bsel select option{background:var(--surface);color:var(--text)}
.side .bsw{margin:0 16px 8px;background:var(--ink-2);border-radius:9px;padding:10px 12px;font-size:12px;color:#a9a392}
.side .bsw b{display:block;color:#fff;font-size:13.5px;margin-top:2px}

/* branch cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.bcard .bh{background:var(--ink);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.bcard .code{font-family:var(--f-num);font-size:12px;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:2px 7px;letter-spacing:.06em}
.bcard .bh h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2}
.bcard .bh p{margin:2px 0 0;color:#b9b4a6;font-size:12.5px}
.bcard .bs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.bcard .bs div{padding:12px 14px;border-inline-start:1px solid var(--line)}
.bcard .bs div:first-child{border-inline-start:0}
.bcard .bs span{display:block;font-size:11.5px;color:var(--muted)}
.bcard .bs b{font-family:var(--f-num);font-size:19px;font-weight:600}
.bcard .bm{padding:12px 18px;display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1}
.bcard .bm div{display:flex;justify-content:space-between;gap:10px}
.bcard .bf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.bcard.add{border-style:dashed;align-items:center;justify-content:center;min-height:260px;cursor:pointer;color:var(--muted);gap:8px;background:transparent}
.bcard.add:hover{border-color:var(--brass);color:var(--text)}
.bcard.add svg{width:30px;height:30px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;background:var(--brass);opacity:.55;border-radius:2px 2px 0 0;min-height:2px}
.spark i:last-child{opacity:1}

/* measurements */
.mlay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.clist{max-height:640px;overflow:auto}
.crow{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.crow:hover{background:var(--ground)}
.crow.on{background:var(--brass-soft);box-shadow:inset 3px 0 0 var(--brass)}
.crow .grow{flex:1;min-width:0}.crow b{display:block;font-weight:600;font-size:13.5px}.crow span{font-size:12px;color:var(--muted)}
